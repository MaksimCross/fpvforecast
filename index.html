<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Free weather forecast for FPV drone pilots: wind by altitude, gusts, rain, clouds, map.">
<meta name="theme-color" content="#0E151E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>
  // На Android есть настоящее приложение (APK) — веб-версию там ставить не предлагаем.
  // Без манифеста Chrome на Android не показывает «Установить приложение».
  if (!/Android/i.test(navigator.userAgent)) {
    var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
  }
</script>
<link rel="apple-touch-icon" href="web/icons/apple-touch-icon.png">

</html>
